name: CA3 Bridge Android

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CA3 Bridge
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "21"
      ANDROID_API: "35"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Debug: Show repo structure"
        run: |
          echo "=== Repository structure ==="
          pwd
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null
          echo "=== Looking for settings.gradle ==="
          find . -name "settings.gradle*" -type f 2>/dev/null

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -euo pipefail
          echo "=== Debug: Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"
          echo "=== Checking for sdkmanager ==="
          if command -v sdkmanager &> /dev/null; then
            echo "sdkmanager found: $(which sdkmanager)"
            sdkmanager --version
          else
            echo "sdkmanager NOT found in PATH"
            echo "Checking ANDROID_HOME/cmdline-tools..."
            ls -la $ANDROID_HOME/cmdline-tools/ 2>/dev/null || echo "cmdline-tools not found"
            ls -la $ANDROID_HOME/cmdline-tools/latest/bin/ 2>/dev/null || echo "latest/bin not found"
          fi
          
          echo "=== Installing Android SDK command line tools if needed ==="
          if ! command -v sdkmanager &> /dev/null; then
            echo "Installing Android SDK command line tools..."
            SDK_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            echo "Downloading from $SDK_TOOLS_URL"
            wget -q "$SDK_TOOLS_URL" -O /tmp/cmdline-tools.zip
            echo "Download complete, unzipping..."
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
            echo "sdkmanager now at: $(which sdkmanager)"
          fi
          
          echo "=== Accepting licenses ==="
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          
          echo "=== Installing components ==="
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          
          echo "=== SDK installation complete ==="

      - name: Verify toolchain
        run: |
          echo "=== Verifying toolchain ==="
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "=== Java version ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== ADB version ==="
          if [ -f "$ANDROID_HOME/platform-tools/adb" ]; then
            "$ANDROID_HOME/platform-tools/adb" version
          else
            echo "ADB not found at $ANDROID_HOME/platform-tools/adb"
            find $ANDROID_HOME -name "adb" 2>/dev/null | head -5
          fi
          echo "=== NDK version ==="
          if [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" ]; then
            "$ANDROID_HOME/ndk/$NDK_VERSION/ndk-build" --version
          else
            echo "ndk-build not found at $ANDROID_HOME/ndk/$NDK_VERSION/ndk-build"
            find $ANDROID_HOME/ndk -name "ndk-build" 2>/dev/null | head -5
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK"

          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-native-arm64
          path: |
            app/build/intermediates/cxx/Release/**/*.so
          if-no-files-found: warn