name: CA3 Bridge Android

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CA3 Bridge
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "21"
      ANDROID_API: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Debug: Show repo structure"
        run: |
          echo "=== Repository structure ==="
          pwd
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null
          echo "=== Looking for settings.gradle ==="
          find . -name "settings.gradle*" -type f 2>/dev/null

      - name: "Set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify gradle.properties
        run: |
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          echo "=== Setting up Android SDK ==="
          # Use the pre-installed Android SDK on GitHub runners
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH
          
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          
          # Accept licenses
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          
          # Install required components
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
          
          echo "=== SDK setup complete ==="

      - name: Gradle cache (dependencies only, no build cache)
        uses: gradle/actions/setup-gradle@v4
        with:\n          cache-dependent-libs: 'all'
          cache-read-only: false

      - name: "Verify toolchain"
        run: |
          echo ">>> VERIFY TOOLCHAIN START <<<"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/35.0.0:$PATH
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "=== Java version ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== ADB version ==="
          "$ANDROID_HOME/platform-tools/adb" version
          echo "=== NDK version ==="
          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Debug keystore created"
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-build-cache

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK"

          # Find apksigner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify "$APK"
          else
            echo "apksigner not found"
            exit 1
          fi

          # CRITICAL: verify the app classes are actually in the dex (guards against a
          # poisoned/stale build cache producing a hollow APK that crashes on launch).
          D8=$(find "$ANDROID_HOME/build-tools" -name "d8" -type f | head -n 1)
          # Unpack the dex from the APK
          unzip -o "$APK" "classes*.dex" -d apk_dexcheck >/dev/null 2>&1 || true
          # Concatenate and scan every dex for the essential app classes
          FOUND_MAIN=0
          for dexfile in apk_dexcheck/*.dex; do
            [ -f "$dexfile" ] || continue
            # dex string check via strings-like scan for class names
            if strings "$dexfile" 2>/dev/null | grep -q "MainActivity"; then
              FOUND_MAIN=1
            fi
          done
          if [ "$FOUND_MAIN" -eq 1 ]; then
            echo "OK: MainActivity class found in APK dex"
          else
            echo "ERROR: MainActivity class MISSING from APK dex — hollow/stale build detected!"
            ls -la apk_dexcheck/ 2>/dev/null
            exit 1
          fi
          rm -rf apk_dexcheck

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-native-arm64
          path: |
            app/build/intermediates/cxx/**/*.so
          if-no-files-found: warn