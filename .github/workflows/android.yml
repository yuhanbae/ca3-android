name: CA3 Bridge Android

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CA3 Bridge
    runs-on: ubuntu-24.04

    env:
      JAVA_VERSION: "21"
      ANDROID_API: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Debug: Show repo structure"
        run: |
          echo "=== Repository structure ==="
          pwd
          ls -la
          echo "=== Looking for gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null
          echo "=== Looking for settings.gradle ==="
          find . -name "settings.gradle*" -type f 2>/dev/null

      - name: "Set up JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify gradle.properties
        run: |
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r28b
          cmake-version: 3.31.6
          build-tools-version: 35.0.0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK setup
        run: |
          set -euo pipefail
          echo "=== Debug: Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "PATH=$PATH"
          echo "=== Checking for sdkmanager ==="
          if command -v sdkmanager &> /dev/null; then
            echo "sdkmanager found: $(which sdkmanager)"
            sdkmanager --version
          else
            echo "sdkmanager NOT found in PATH"
          fi
          echo "=== Accepting licenses ==="
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "=== SDK setup complete ==="

      - name: "Verify toolchain"
        run: |
          echo ">>> VERIFY TOOLCHAIN START <<<"
          echo "JAVA_HOME: $JAVA_HOME"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "=== Java version ==="
          java -version
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== ADB version ==="
          if [ -f "$ANDROID_HOME/platform-tools/adb" ]; then
            "$ANDROID_HOME/platform-tools/adb" version
          else
            echo "ADB not found at $ANDROID_HOME/platform-tools/adb"
            find $ANDROID_HOME -name "adb" 2>/dev/null | head -5
          fi
          echo "=== NDK version ==="
          if [ -n "$ANDROID_NDK_HOME" ] && [ -f "$ANDROID_NDK_HOME/ndk-build" ]; then
            "$ANDROID_NDK_HOME/ndk-build" --version
          else
            echo "ndk-build not found at $ANDROID_NDK_HOME/ndk-build"
            find $ANDROID_HOME/ndk -name "ndk-build" 2>/dev/null | head -5
          fi

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Debug keystore created"
          fi

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK"

          # Find apksigner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify "$APK"
          else
            echo "apksigner not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-native-arm64
          path: |
            app/build/intermediates/cxx/**/*.so
          if-no-files-found: warn