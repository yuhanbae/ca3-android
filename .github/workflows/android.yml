name: CA3 Bridge Android

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CA3 Bridge
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ca3-android

    env:
      JAVA_VERSION: "21"
      ANDROID_API: "35"
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          set -x
          echo "=== Android SDK Installation ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          
          # Install Android SDK command line tools if not present
          if ! command -v sdkmanager &> /dev/null; then
            echo "Installing Android SDK command line tools..."
            SDK_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            wget -q "$SDK_TOOLS_URL" -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          fi
          
          echo "sdkmanager version: $(sdkmanager --version)"
          
          # Accept licenses
          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          
          # Install components
          echo "Installing Android SDK components..."
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          ${ANDROID_HOME}/platform-tools/adb version
          ${ANDROID_HOME}/ndk/${NDK_VERSION}/ndk-build --version

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release \
            -name "*.apk" -type f | head -n 1)

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK"

          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-release
          path: ca3-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: CA3-Bridge-native-arm64
          path: |
            ca3-android/app/build/intermediates/cxx/Release/**/*.so
          if-no-files-found: warn