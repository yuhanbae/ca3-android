# Termux aarch64 workaround: AGP downloads an x86_64-host aapt2 from Maven that
# cannot execute on this device. Redirect to a wrapper that runs Termux's native aapt2.
# android.aapt2FromMavenOverride=/data/data/com.termux/files/home/bt/aapt2ovr/bin/aapt2

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Resource-constrained device: keep thread use low and cache aggressive.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official
kotlin.jvmToolchainVersion=17